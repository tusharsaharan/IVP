[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroq-connect"
version = "0.1.0"
description = "A reproducible workspace for connectivity-guided quantum EEG experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "pennylane>=0.40,<0.46",
  "mne>=1.9,<2",
  "streamlit>=1.50,<2",
  "PyYAML>=6,<7",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
neuroq = "asd_eeg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
