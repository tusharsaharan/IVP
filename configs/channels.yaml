# Channel configuration and montage documentation for TUOS dataset
# Dataset: The University of Sheffield (Dickinson et al. 2021, Cortex)
# System: BioSemi ActiveTwo 64-channel 10-20 layout

montage:
  system: BioSemi ActiveTwo
  sampling_rate_hz: 512.0
  recording_type: Continuous resting state (eyes closed)
  typical_duration_seconds: 160.0

# Authoritative four-node electrode mapping
# Fixed order: Node 0, Node 1, Node 2, Node 3
nodes:
  - index: 0
    name: Left frontal
    channels: [F7]
    description: Left anterior temporal/frontal lobe electrode
  - index: 1
    name: Frontal midline
    channels: [Fz]
    description: Superior frontal gyrus / anterior midline electrode
  - index: 2
    name: Left posterior
    channels: [P1]
    description: Left parietal / superior parietal cortex electrode
  - index: 3
    name: Right posterior
    channels: [O2]
    description: Right occipital cortex electrode

# Fixed edge ordering for the 6 pairwise connections
edges:
  - index: 0
    pair: [0, 1]
    name: Left frontal <-> Frontal midline
  - index: 1
    pair: [0, 2]
    name: Left frontal <-> Left posterior
  - index: 2
    pair: [0, 3]
    name: Left frontal <-> Right posterior
  - index: 3
    pair: [1, 2]
    name: Frontal midline <-> Left posterior
  - index: 4
    pair: [1, 3]
    name: Frontal midline <-> Right posterior
  - index: 5
    pair: [2, 3]
    name: Left posterior <-> Right posterior

# Scalp regional groupings for multi-electrode aggregation (Aryan's reference)
regional_groups:
  left_frontal: [Fp1, AF7, AF3, F7, F5, F3, FC5, FC1]
  right_frontal: [Fp2, AF8, AF4, F8, F6, F4, FC6, FC2]
  left_posterior: [P1, P3, P5, P7, CP1, PO7, PO3, O1]
  right_posterior: [P2, P4, P6, P8, CP2, PO8, PO4, O2]
