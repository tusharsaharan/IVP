# EEG Preprocessing configuration for NeuroQ-Connect
# Pipeline: conservative, documented, training-population independent

preprocessing:
  # Sampling and filtering
  target_sfreq: 128.0
  low_hz: 1.0
  high_hz: 40.0
  filter_type: butterworth_sos_4th_order
  filter_direction: zero_phase_bidirectional

  # Line noise attenuation (50 Hz mains suppression)
  # At 128 Hz sampling, Nyquist is 64 Hz (so 50 Hz does not alias).
  # The 50 Hz notch suppresses strong laboratory mains powerline hum before
  # residual mains energy can leak through the 40 Hz filter transition band.
  line_hz: 50.0
  notch_quality_factor: 30.0

  # Spatial referencing
  reference: average
  reference_channels: all_good_channels

  # Windowing and epoching (18-window common duration budget = 144.0 seconds)
  window_seconds: 8.0
  window_overlap: 0.0
  min_windows: 3
  max_windows: 18

  # Quality control rejection thresholds
  max_peak_to_peak_uv: 300.0
  min_channel_std_volts: 1.0e-12
  require_finite: true

# Frequency bands for Welch power spectrum integration
bands:
  - name: delta
    low: 1.0
    high: 4.0
  - name: theta
    low: 4.0
    high: 8.0
  - name: alpha
    low: 8.0
    high: 13.0
  - name: beta
    low: 13.0
    high: 30.0
